<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP TEST SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; padding-top: 2rem; }
        h1 { font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; color: #333; font-weight: bold; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: none; }
        .submit-but { border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container-fluid px-5">
        <h1 class="text-center mb-5">IP TEST SYSTEM</h1>
        
        <div class="row">
            <!-- Sol Panel: Ekleme İşlemleri -->
            <div class="col-md-3 mb-4">
                <div class="card p-4">
                    <h4 class="mb-4 text-center">Yeni Cihaz Ekle</h4>
                    <input type="text" id="ipInput" placeholder="IP Adresi (Örn: 192.168.1.50)" class="form-control mb-3" >
                    <input type="text" id="macInput" placeholder="MAC Adresi" class="form-control mb-3" >
                    <input type="text" id="clientInput" placeholder="Cihaz Sahibi" class="form-control mb-4" >
                    <button id="submitBtn" class="btn btn-primary submit-but w-100 py-2">Sisteme Kaydet</button>

                    <hr class="my-4">

                    <h6 class="text-center mb-3">Toplu Cihaz Yükle</h6>
                    <input type="file" id="csvInput" accept=".csv" style="display:none;">
                    <label for="csvInput" class="btn btn-secondary w-100" id="csvLabel">CSV Dosyası Seç</label>
                    <div id="csvFilename" class="mt-2 small text-truncate text-center">Seçilmedi</div>
                    <button id="csvUploadBtn" class="btn btn-success w-100 mt-2">Dosyayı Veritabanına Aktar</button>
                </div>
            </div>

            <!-- Sağ Panel: Liste ve Tablo -->
            <div class="col-md-9">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="m-0">Ağdaki Cihazlar</h4>
                        <div>
                            <button id="pingAllBtn" class="btn btn-warning fw-bold px-4">⚡ Tümüne Ping At</button>
                            <!-- YENİ EKLENEN EXCEL BUTONU -->
                            <button id="exportExcelBtn" class="btn btn-success fw-bold px-4 ms-2">📥 Excel'e İndir</button>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>IP Adresi</th>
                                    <th>MAC Adresi</th>
                                    <th>Cihaz Sahibi</th>
                                    <th>Durum</th>
                                    <th>Son Kontrol Tarihi</th>
                                    <th>İşlem</th>
                                </tr>
                            </thead>
                            <tbody id="cihazListesiBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tabloGovdesi = document.getElementById("cihazListesiBody");
        const apiAdresi = "https://localhost:7216/api/cihazlar";

        // 1. Verileri Getir ve Tabloya Bas
        async function cihazlariGetir() {
            try {
                const cevap = await fetch(apiAdresi);
                const cihazlar = await cevap.json();
                tabloGovdesi.innerHTML = "";
                
                cihazlar.forEach(cihaz => {
                    let satir = `<tr>
                        <td>${cihaz.id}</td>
                        <td>${cihaz.ipAdresi}</td>
                        <td>${cihaz.macAdresi}</td>
                        <td>${cihaz.cihazSahibi}</td>
                        <td><span class="badge ${cihaz.aktifMi ? 'bg-success' : 'bg-danger'}">${cihaz.aktifMi ? 'Aktif' : 'Pasif'}</span></td>
                        <td>${new Date(cihaz.sonKontrolTarihi).toLocaleString()}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="cihazSil(${cihaz.id})">❌</button></td>
                    </tr>`;
                    tabloGovdesi.innerHTML += satir;
                });
            } catch (hata) {
                console.error("Getirme hatası:", hata);
            }
        }

        // 2. Yeni Cihaz Ekle
        document.getElementById("submitBtn").addEventListener("click", async () => {
            const ip = document.getElementById("ipInput").value;
            const mac = document.getElementById("macInput").value;
            const client = document.getElementById("clientInput").value;

            try {
                const response = await fetch(apiAdresi, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ipAdresi: ip, macAdresi: mac, cihazSahibi: client })
                });

                if (response.ok) {
                    alert("Cihaz eklendi!");
                    cihazlariGetir(); 
                }
            } catch (error) {
                console.error("Ekleme hatası:", error);
            }
        });

        // 3. Cihaz Sil
        async function cihazSil(id) {
            if (!confirm("Silmek istediğinize emin misiniz?")) return;
            try {
                await fetch(`${apiAdresi}/${id}`, { method: "DELETE" });
                await cihazlariGetir(); 
            } catch (hata) {
                console.error("Silme hatası:", hata);
            }
        }

        // 4. Tümüne Ping At
        const pingBtn = document.getElementById("pingAllBtn");
        pingBtn.addEventListener("click", async () => {
            try {
                pingBtn.innerHTML = "⏳ Kontrol Ediliyor...";
                await fetch("https://localhost:7216/api/ping/hepsini-kontrol-et", { method: "POST" });
                await cihazlariGetir();
                pingBtn.innerHTML = "⚡ Tümüne Ping At";
            } catch (hata) {
                console.error("Ping hatası:", hata);
                pingBtn.innerHTML = "⚡ Tümüne Ping At";
            }
        });

        // 5. CSV Dosya Seçimini Ekranda Göster
        const csvInput = document.getElementById("csvInput");
        csvInput.addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (file) {
                document.getElementById("csvFilename").textContent = file.name;
            }
        });

        // 6. CSV Dosyasını API'ye Gönder
        document.getElementById("csvUploadBtn").addEventListener("click", async () => {
            const file = csvInput.files[0];
            if (!file) {
                alert("Lütfen bir CSV dosyası seçin!");
                return;
            }

            let formData = new FormData();
            formData.append("dosya", file); 

            try {
                await fetch(`${apiAdresi}/csv-yukle`, {
                    method: "POST",
                    body: formData 
                });

                alert("Cihazlar CSV'den aktarıldı!");
                cihazlariGetir();
                csvInput.value = "";
                document.getElementById("csvFilename").textContent = "Seçilmedi";
            } catch (error) {
                console.error("CSV yükleme hatası:", error);
            }
        });

        // 7. Excel'e (CSV) İndirme İşlemi 
        document.getElementById("exportExcelBtn").addEventListener("click", async () => {
            try {
                const cevap = await fetch(apiAdresi);
                const cihazlar = await cevap.json();

                // İP Adresi, MAC Adresi, Cihaz Sahibi
                let csvIcerigi = "ID;IP Adresi;MAC Adresi;Cihaz Sahibi;Durum;Son Kontrol\n";

                cihazlar.forEach(cihaz => {
                    let durum = cihaz.aktifMi ? "Aktif" : "Pasif";
                    let tarih = new Date(cihaz.sonKontrolTarihi).toLocaleString();

                    
                    csvIcerigi += `${cihaz.id};${cihaz.ipAdresi};${cihaz.macAdresi};${cihaz.cihazSahibi};${durum};${tarih}\n`;
                });

                // BOM (Türkçe karakter desteği)
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]); 
                const blob = new Blob([bom, csvIcerigi], { type: "text/csv;charset=utf-8;" });

                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "IP_Envanter_Raporu.csv"; 
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (hata) {
                console.error("Excel indirme hatası:", hata);
                alert("Rapor oluşturulurken bir hata meydana geldi.");
            }
        });

        // Sayfa açıldığında tabloyu doldur
        cihazlariGetir();
    </script>
</body>
</html>
